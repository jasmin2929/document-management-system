server:
  port: ${PORT:8081}
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: rest-api

  # File Upload limits (Multipart)
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

  # PostgreSQL connection
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres-db:5432/dms_db}
    username: ${SPRING_DATASOURCE_USERNAME:jasmin}
    password: ${SPRING_DATASOURCE_PASSWORD:swen3_dms_2901}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000

  # RabbitMQ connection
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:rabbitmq}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:dms_user}
    password: ${SPRING_RABBITMQ_PASSWORD:dms_password_change_me}

  # JPA / Hibernate settings
  jpa:
    hibernate:
      ddl-auto: update
    # SQL logging is controlled via logging.level.org.hibernate.SQL below instead of printing to stdout
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

# Custom Application Configuration (DMS)
dms:
  upload:
    dir: ${DMS_UPLOAD_DIR:./uploads}
  cors:
    allowed-origins: ${DMS_CORS_ALLOWED_ORIGINS:http://localhost,http://localhost:80,http://localhost:5173}

# Logging (SLF4J + Logback, Spring Boot default)
logging:
  level:
    root: INFO
    com.dms.rest_api: ${DMS_LOG_LEVEL:INFO}
    # set to DEBUG to see every SQL statement Hibernate executes
    org.hibernate.SQL: ${DMS_SQL_LOG_LEVEL:WARN}
  pattern:
    # adds the request ID from RequestLoggingFilter to every log line, e.g. "INFO [3f2a9c1b]"
    level: "%5p [%X{requestId:-}]"
