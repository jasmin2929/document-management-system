server:
  port: ${PORT:8081}
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: rest-api

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres-db:5432/dms_db}
    username: ${SPRING_DATASOURCE_USERNAME:jasmin}
    password: ${SPRING_DATASOURCE_PASSWORD:swen3_dms_2901}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:rabbitmq}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:dms_user}
    password: ${SPRING_RABBITMQ_PASSWORD:dms_password_change_me}
    listener:
      simple:
        # drop a failing result message instead of redelivering it forever
        default-requeue-rejected: false

  jpa:
    hibernate:
      ddl-auto: update
    # use logging.level.org.hibernate.SQL instead
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

dms:
  storage:
    endpoint: ${DMS_STORAGE_ENDPOINT:http://rustfs:9000}
    access-key: ${DMS_STORAGE_ACCESS_KEY:dms_storage_user}
    secret-key: ${DMS_STORAGE_SECRET_KEY:dms_storage_password_change_me}
    bucket: ${DMS_STORAGE_BUCKET:dms-documents}
    region: ${DMS_STORAGE_REGION:us-east-1}
  cors:
    allowed-origins: ${DMS_CORS_ALLOWED_ORIGINS:http://localhost,http://localhost:80,http://localhost:5173}

logging:
  level:
    root: INFO
    com.dms.rest_api: ${DMS_LOG_LEVEL:INFO}
    # set to DEBUG to see every SQL statement Hibernate executes
    org.hibernate.SQL: ${DMS_SQL_LOG_LEVEL:WARN}
  pattern:
    # adds the request ID from RequestLoggingFilter to every log line, e.g. "INFO [3f2a9c1b]"
    level: "%5p [%X{requestId:-}]"
