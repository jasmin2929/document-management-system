server:
  port: ${PORT:8081}
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: rest-api

  # File Upload limits (Multipart)
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

  # PostgreSQL connection
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres-db:5432/dms_db}
    username: ${SPRING_DATASOURCE_USERNAME:jasmin}
    password: ${SPRING_DATASOURCE_PASSWORD:swen3_dms_2901}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000

  # JPA / Hibernate settings
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  # Custom Application Configuration (DMS)
  dms:
    upload:
      dir: ${DMS_UPLOAD_DIR:./uploads}