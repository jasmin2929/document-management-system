server:
  port: 8081

spring:
  application:
    name: rest-api

  # PostgreSQL connection
  datasource:
    url: jdbc:postgresql://localhost:5432/paperless_db
    username: paperless_user
    password: paperless_password_change_me
    driver-class-name: org.postgresql.Driver

  # JPA / Hibernate settings
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect