server:
  port: ${PORT:8081}
  error:
    # GlobalExceptionHandler builds all API error responses; Spring's fallback error page
    # (e.g. errors thrown in filters) must not expose internal exception messages
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

spring:
  application:
    name: rest-api

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres-db:5432/dms_db}
    username: ${SPRING_DATASOURCE_USERNAME:jasmin}
    password: ${SPRING_DATASOURCE_PASSWORD:swen3_dms_2901}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:rabbitmq}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:dms_user}
    password: ${SPRING_RABBITMQ_PASSWORD:dms_password_change_me}
    listener:
      simple:
        # drop a failing result message instead of redelivering it forever
        default-requeue-rejected: false
        # transient failures (e.g. database briefly unavailable) are retried in-process before the
        # message is dropped: 3 attempts, waiting 1s and 2s in between; the summary is not lost on a short outage
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2
          max-interval: 10s

  jpa:
    hibernate:
      ddl-auto: update
    # use logging.level.org.hibernate.SQL instead
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

dms:
  storage:
    endpoint: ${DMS_STORAGE_ENDPOINT:http://rustfs:9000}
    access-key: ${DMS_STORAGE_ACCESS_KEY:dms_storage_user}
    secret-key: ${DMS_STORAGE_SECRET_KEY:dms_storage_password_change_me}
    bucket: ${DMS_STORAGE_BUCKET:dms-documents}
    region: ${DMS_STORAGE_REGION:us-east-1}
  elasticsearch:
    url: ${DMS_ELASTICSEARCH_URL:http://elasticsearch:9200}
    username: ${DMS_ELASTICSEARCH_USERNAME:elastic}
    password: ${DMS_ELASTICSEARCH_PASSWORD:elastic_password_change_me}
    index: ${DMS_ELASTICSEARCH_INDEX:documents}
  cors:
    allowed-origins: ${DMS_CORS_ALLOWED_ORIGINS:http://localhost,http://localhost:80,http://localhost:5173}

logging:
  level:
    root: INFO
    com.dms.rest_api: ${DMS_LOG_LEVEL:INFO}
    # set to DEBUG to see every SQL statement Hibernate executes
    org.hibernate.SQL: ${DMS_SQL_LOG_LEVEL:WARN}
  pattern:
    # adds the request ID from RequestLoggingFilter to every log line, e.g. "INFO [3f2a9c1b]"
    level: "%5p [%X{requestId:-}]"
