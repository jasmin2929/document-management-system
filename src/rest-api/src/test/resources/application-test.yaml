server:
  port: 8081

spring:
  application:
    name: rest-api-test

  # H2 In-Memory Datenbank anstelle von PostgreSQL für Unit-/Smoke-Tests
  datasource:
    url: jdbc:h2:mem:dms_testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    username: sa
    password: 
    driver-class-name: org.h2.Driver

  # JPA / Hibernate auf H2-Dialekt anpassen
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.H2Dialect

  # Autoconfiguration für RabbitMQ/ElasticSearch deaktivieren, falls diese lokal nicht laufen
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
      - org.springframework.boot.autoconfigure.data.elasticsearch.ElasticsearchDataAutoConfiguration