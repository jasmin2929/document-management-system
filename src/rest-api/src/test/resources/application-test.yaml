server:
  port: 0 # random/anonymous port in test to avoid port collisions

spring:
  application:
    name: rest-api-test

  # Multipart Uploads in Test
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  # H2 In-Memory Database instead of PostgreSQL for Unit-/Smoke-Tests
  datasource:
    url: jdbc:h2:mem:dms_testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    username: sa
    password: 
    driver-class-name: org.h2.Driver

  # adapt JPA / Hibernate to H2-Dialect for testing purposes
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.H2Dialect

  # RabbitMQ is not running during tests
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration

# S3Client is replaced by a mock in the context test, these values only satisfy the configuration binding
dms:
  storage:
    endpoint: http://localhost:9000
    access-key: test
    secret-key: test
    bucket: test-bucket
    region: us-east-1