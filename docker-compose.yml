services:
  postgres-db:
    image: postgres:16-alpine
    container_name: dms-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dms_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dms_password_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-dms_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dms_user} -d ${POSTGRES_DB:-dms_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: dms-rabbitmq
    hostname: dms-rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-dms_user}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-dms_password_change_me}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      
  rustfs:
    image: rustfs/rustfs:1.0.3
    container_name: dms-rustfs
    restart: always
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-dms_storage_user}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-dms_storage_password_change_me}
      RUSTFS_CONSOLE_ENABLE: "true"
      # empty = log to stdout
      RUSTFS_OBS_LOG_DIRECTORY: ""
    ports:
      - "${RUSTFS_PORT:-9000}:9000"
      - "${RUSTFS_CONSOLE_PORT:-9001}:9001"
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.1.3
    container_name: dms-elasticsearch
    restart: always
    environment:
      discovery.type: single-node
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:-elastic_password_change_me}
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs -u elastic:$${ELASTIC_PASSWORD} http://localhost:9200/_cluster/health"]
      interval: 10s
      timeout: 5s
      retries: 20

  elasticsearch-setup:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.1.3
    container_name: dms-elasticsearch-setup
    restart: "no"
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:-elastic_password_change_me}
      KIBANA_PASSWORD: ${KIBANA_PASSWORD:-kibana_password_change_me}
    command:
      - bash
      - -c
      - |
        curl -fsS -u "elastic:$${ELASTIC_PASSWORD}" -H 'Content-Type: application/json' \
          -X POST http://elasticsearch:9200/_security/user/kibana_system/_password \
          -d "{\"password\":\"$${KIBANA_PASSWORD}\"}"

  kibana:
    image: docker.elastic.co/kibana/kibana:9.1.3
    container_name: dms-kibana
    restart: always
    depends_on:
      elasticsearch-setup:
        condition: service_completed_successfully
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      ELASTICSEARCH_USERNAME: kibana_system
      ELASTICSEARCH_PASSWORD: ${KIBANA_PASSWORD:-kibana_password_change_me}
    ports:
      - "${KIBANA_PORT:-5601}:5601"

  ocr-worker:
    build:
      context: ./src/ocr-worker
      dockerfile: Dockerfile
    container_name: dms-ocr-worker
    restart: always
    depends_on:
      rabbitmq:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_DEFAULT_USER:-dms_user}
      RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:-dms_password_change_me}
      OCR_QUEUE: ocr-queue
      OCR_RESULT_QUEUE: ocr-result-queue
      LOG_LEVEL: INFO
      OCR_LANGUAGE: ${OCR_LANGUAGE:-deu+eng}
      OCR_DPI: 300
      OCR_MAX_PAGES: 50
      STORAGE_ENDPOINT: http://rustfs:9000
      STORAGE_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-dms_storage_user}
      STORAGE_SECRET_KEY: ${RUSTFS_SECRET_KEY:-dms_storage_password_change_me}
      STORAGE_BUCKET: ${RUSTFS_BUCKET_NAME:-dms-documents}
      ELASTICSEARCH_URL: http://elasticsearch:9200
      ELASTICSEARCH_USER: elastic
      ELASTICSEARCH_PASSWORD: ${ELASTIC_PASSWORD:-elastic_password_change_me}
      ELASTICSEARCH_INDEX: documents

  rest-api:
    build:
      context: ./src/rest-api
      dockerfile: Dockerfile
    container_name: dms-rest-api
    restart: always
    ports:
      - "${REST_API_PORT:-8081}:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/${POSTGRES_DB:-dms_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-dms_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-dms_password_change_me}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER:-dms_user}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:-dms_password_change_me}
      DMS_STORAGE_ENDPOINT: http://rustfs:9000
      DMS_STORAGE_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-dms_storage_user}
      DMS_STORAGE_SECRET_KEY: ${RUSTFS_SECRET_KEY:-dms_storage_password_change_me}
      DMS_STORAGE_BUCKET: ${RUSTFS_BUCKET_NAME:-dms-documents}
      DMS_ELASTICSEARCH_URL: http://elasticsearch:9200
      DMS_ELASTICSEARCH_USERNAME: elastic
      DMS_ELASTICSEARCH_PASSWORD: ${ELASTIC_PASSWORD:-elastic_password_change_me}
      DMS_ELASTICSEARCH_INDEX: documents
    depends_on:
      postgres-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      rustfs:
        condition: service_healthy

  web-ui:
    build:
      context: ./src/web-ui
      dockerfile: Dockerfile
    container_name: dms-web-ui
    restart: always
    ports:
      - "${WEB_UI_PORT:-80}:80"
    depends_on:
      - rest-api
      
volumes:
  postgres-data:
  rabbitmq-data:
  rustfs-data:
  elasticsearch-data: