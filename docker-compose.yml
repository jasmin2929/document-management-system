services:
  # ==========================================
  # PostgreSQL Database Service
  # ==========================================
  postgres-db:
    image: postgres:16-alpine
    container_name: dms-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dms_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dms_password_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-dms_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dms_user} -d ${POSTGRES_DB:-dms_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==========================================
  # RabbitMQ Message Broker (+ Management UI)
  # ==========================================
  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: dms-rabbitmq
    hostname: dms-rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-dms_user}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-dms_password_change_me}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      
  # ==========================================
  # RustFS Object Storage (S3-compatible, + Web Console)
  # ==========================================
  rustfs:
    image: rustfs/rustfs:1.0.3
    container_name: dms-rustfs
    restart: always
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-dms_storage_user}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-dms_storage_password_change_me}
      RUSTFS_CONSOLE_ENABLE: "true"
      # empty = write logs to stdout, so they show up in `docker compose logs rustfs`
      RUSTFS_OBS_LOG_DIRECTORY: ""
    ports:
      - "${RUSTFS_PORT:-9000}:9000"
      - "${RUSTFS_CONSOLE_PORT:-9001}:9001"
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ==========================================
  # OCR Worker Service (Python)
  # ==========================================
  ocr-worker:
    build:
      context: ./src/ocr-worker
      dockerfile: Dockerfile
    container_name: dms-ocr-worker
    restart: always
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_DEFAULT_USER:-dms_user}
      RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:-dms_password_change_me}
      OCR_QUEUE: ocr-queue
      LOG_LEVEL: INFO
      # Tesseract languages (German + English) and limits for one document
      OCR_LANGUAGE: ${OCR_LANGUAGE:-deu+eng}
      OCR_DPI: 300
      OCR_MAX_PAGES: 50

  # ==========================================
  # Spring Boot REST API Service
  # ==========================================
  rest-api:
    build:
      context: ./src/rest-api
      dockerfile: Dockerfile
    container_name: dms-rest-api
    restart: always
    ports:
      - "${REST_API_PORT:-8081}:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/${POSTGRES_DB:-dms_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-dms_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-dms_password_change_me}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER:-dms_user}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:-dms_password_change_me}
      DMS_STORAGE_ENDPOINT: http://rustfs:9000
      DMS_STORAGE_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-dms_storage_user}
      DMS_STORAGE_SECRET_KEY: ${RUSTFS_SECRET_KEY:-dms_storage_password_change_me}
      DMS_STORAGE_BUCKET: ${RUSTFS_BUCKET_NAME:-dms-documents}
    depends_on:
      postgres-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      rustfs:
        condition: service_healthy

  # ==========================================
  # Web UI Service (React + Nginx)
  # ==========================================
  web-ui:
    build:
      context: ./src/web-ui
      dockerfile: Dockerfile
    container_name: dms-web-ui
    restart: always
    ports:
      - "${WEB_UI_PORT:-80}:80"
    depends_on:
      - rest-api
      
volumes:
  postgres-data:
  rabbitmq-data:
  rustfs-data: